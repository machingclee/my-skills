# Flyway configuration - {{schema}} schema (PROD)
#
# Fill in real host/user/password before running.
# Prefer NOT committing real secrets — use machine-local overrides or uncomment
# flyway-*-prod.conf in .gitignore.

flyway.url=jdbc:mysql://{{prodHost}}:3306/{{schema}}?useSSL=true&serverTimezone={{timezone}}
flyway.user={{prodUser}}
flyway.password={{prodPassword}}

# Migration script location for {{schema}} schema
flyway.locations=filesystem:src/main/resources/db/migration/{{schema}}

# Flyway tracks its history in this table inside the {{schema}} schema
flyway.table=flyway_schema_history

flyway.baselineOnMigrate=false
flyway.baselineVersion=0

flyway.outOfOrder=false
flyway.validateOnMigrate=true
