[project]
name = "vector-db"
version = "0.1.0"
description = "Semantic chunking + pgvector ingestion for the AgentCore RAG agent"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0.0",
    "openai>=2.45.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.0",
    "python-dotenv>=1.1.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0",
    "tqdm>=4.0",
]

[tool.uv]
package = false
